server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:file:./data/arus-ai;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console

arus:
  demo-data:
    enabled: true
    reset: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
